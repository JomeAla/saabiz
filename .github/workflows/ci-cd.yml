name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '10'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build API + Web
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build API
        run: pnpm build:api

      - name: Build Web
        run: pnpm build:web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saabiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # 127.0.0.1 (not localhost) — Node resolves localhost→::1 first, and
      # the CI/runners' Postgres services bind IPv4 only.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saabiz?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-ci-test-secret
      NODE_ENV: production
      PORT: 3001
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PLATFORM_DOMAIN: saabiz.com
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
      E2E_BASE_URL: http://localhost:3000
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy --schema=libs/prisma/schema/schema.prisma

      - name: Seed database
        run: pnpm prisma:seed

      - name: Build API
        run: pnpm build:api

      - name: Build Web
        run: pnpm build:web

      - name: Write .env
        run: cp .env.example .env
        env:
          # the env block above fails fast on real-use? no — .env is written from template
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saabiz?schema=public

      - name: Start API server
        run: |
          nohup node -r dotenv/config dist/apps/api/src/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3001/api/health || (echo "API failed to start"; cat api.log; exit 1)

      - name: Start Web server
        run: |
          nohup npx next start apps/web -p 3000 > web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000 > /dev/null || (echo "Web failed to start"; cat web.log; exit 1)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        timeout-minutes: 20

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true