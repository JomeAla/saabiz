version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saabiz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mylordhelpme12
      POSTGRES_DB: saabiz
    ports:
      - "5434:5432"
    volumes:
      - saabiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saabiz-redis
    ports:
      - "6380:6379"
    volumes:
      - saabiz-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saabiz-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:Mylordhelpme12@postgres:5432/saabiz?schema=public
      - JWT_SECRET=SAABIZ_JWT_SECRET_2026_KEY
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: saabiz-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://saabiz-api:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  saabiz-postgres-data:
  saabiz-redis-data:

networks:
  default:
    name: saabiz-network
